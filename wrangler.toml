name = "werewolf-game"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# D1 绑定说明：
# 1. 线上部署：在 Cloudflare Pages 项目 → Settings → Bindings 里绑定 D1（变量名 DB）
# 2. 本地开发：用 `npm run dev:full` 同时启动 vite + wrangler，需在本地执行 `npm run db:init` 建表
#    本地 wrangler 会读取 .dev.vars 获取 D1 绑定和密码

# 密码配置：
# - 本地：复制 .dev.vars.example 为 .dev.vars，填入 ADMIN_PASSWORD / CREATE_PASSWORD
# - 线上：Cloudflare Pages 项目 → Settings → Environment variables 添加
