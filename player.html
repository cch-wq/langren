<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狼人杀 - 玩家</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 10px;
            color: #333;
            font-size: 14px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 12px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .day-info {
            font-size: 14px;
            color: #666;
        }
        
        .countdown-bar {
            display: none;
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .countdown-bar.show {
            display: block;
        }
        .countdown-number {
            font-size: 36px;
            font-weight: bold;
        }
        .countdown-text {
            font-size: 14px;
            margin-top: 5px;
        }
        .pk-targets {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.9;
        }
        
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .role-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: #f8f8f8;
            border-radius: 12px;
        }
        .role-card.werewolf {
            background: linear-gradient(135deg, #fff1f0 0%, #ffebe8 100%);
            border-left: 4px solid #ff4d4f;
        }
        .role-card.god {
            background: linear-gradient(135deg, #f9f0ff 0%, #efdbff 100%);
            border-left: 4px solid #722ed1;
        }
        .role-card.villager {
            background: linear-gradient(135deg, #f6ffed 0%, #d9f7be 100%);
            border-left: 4px solid #52c41a;
        }
        .role-icon {
            font-size: 36px;
        }
        .role-info {
            flex: 1;
        }
        .role-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .role-team {
            font-size: 12px;
            color: #666;
        }
        .alive-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .alive-status.alive {
            background: #f6ffed;
            color: #52c41a;
        }
        .alive-status.dead {
            background: #fff1f0;
            color: #ff4d4f;
        }
        
        .players-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 10px 0;
        }
        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            background: #fff;
            border: 2px solid #e8e8e8;
            position: relative;
        }
        .player-avatar.dead {
            opacity: 0.4;
            background: #f5f5f5;
        }
        .player-avatar.self {
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        .player-avatar.wolf-teammate {
            border-color: #ff4d4f;
            box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.2);
        }
        .player-avatar .annotation {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
        }
        .annotation-gold {
            background: rgba(255, 215, 0, 0.3);
            color: rgba(218, 165, 32, 0.8);
        }
        .annotation-god {
            background: rgba(114, 46, 209, 0.4);
            color: #722ed1;
        }
        .annotation-wolf {
            background: rgba(255, 77, 79, 0.4);
            color: #ff4d4f;
        }
        .annotation-villager {
            background: rgba(82, 196, 26, 0.4);
            color: #52c41a;
        }
        .player-avatar .sd-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 14px;
            padding: 2px;
            border-radius: 50%;
            background: rgba(255, 77, 79, 0.9);
            color: white;
            box-shadow: 0 0 6px rgba(255, 77, 79, 0.6);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            width: 80%;
            max-width: 300px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .annotation-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .annotation-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .annotation-btn:active {
            opacity: 0.8;
        }
        .annotation-btn.gold {
            background: rgba(255, 215, 0, 0.2);
            color: rgba(218, 165, 32, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .annotation-btn.god {
            background: rgba(114, 46, 209, 0.2);
            color: #722ed1;
            border: 1px solid rgba(114, 46, 209, 0.3);
        }
        .annotation-btn.wolf {
            background: rgba(255, 77, 79, 0.2);
            color: #ff4d4f;
            border: 1px solid rgba(255, 77, 79, 0.3);
        }
        .annotation-btn.villager {
            background: rgba(82, 196, 26, 0.2);
            color: #52c41a;
            border: 1px solid rgba(82, 196, 26, 0.3);
        }
        .annotation-btn.cancel {
            background: rgba(150, 150, 150, 0.2);
            color: #999;
            border: 1px solid rgba(150, 150, 150, 0.3);
        }
        .player-avatar.can-vote {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .player-avatar.can-vote:active {
            transform: scale(0.95);
        }
        .player-avatar.selected {
            border-color: #1890ff;
            background: #e6f7ff;
        }
        
        .vote-actions {
            display: none;
            gap: 10px;
            margin-top: 15px;
        }
        .vote-actions.show {
            display: flex;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .day-indicator {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .swipe-container {
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: pan-x;
            position: relative;
        }
        .vote-results {
            padding: 10px 0;
            transition: transform 0.3s ease;
        }
        .swipe-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        .vote-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 5px;
            flex-wrap: wrap;
        }
        .vote-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            background: #f0f0f0;
            border: 2px solid #d9d9d9;
        }
        .vote-avatar.wolf-vote {
            border-color: #ff4d4f;
            background: rgba(255, 77, 79, 0.1);
        }
        .vote-arrow {
            color: #999;
            font-size: 12px;
        }
        .vote-abstain {
            background: #fff7e6;
            border-color: #ffc53d;
            color: #d48806;
        }
        
        .voted-message {
            display: none;
            text-align: center;
            padding: 20px;
            color: #52c41a;
            font-size: 16px;
        }
        .voted-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐺 狼人杀</h1>
            <div class="day-info" id="day-info">第 1 天</div>
        </header>
        
        <div class="countdown-bar" id="countdown-bar">
            <div class="countdown-number" id="countdown-number">10</div>
            <div class="countdown-text" id="countdown-mode">普票进行中...</div>
            <div class="pk-targets" id="pk-targets"></div>
        </div>
        
        <div class="card">
            <div class="card-title">我的身份</div>
            <div class="role-card" id="role-card">
                <div class="role-icon" id="role-icon">❓</div>
                <div class="role-info">
                    <div class="role-name" id="role-name">加载中...</div>
                    <div class="role-team" id="role-team">-</div>
                </div>
                <div class="alive-status alive" id="alive-status">存活</div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">所有玩家</div>
            <div class="players-row" id="players-row"></div>
            <div class="vote-actions" id="vote-actions">
                <button class="btn btn-primary" onclick="window.confirmVote()">确认投票</button>
                <button class="btn btn-secondary" onclick="window.abstainVote()">弃票</button>
            </div>
            <div class="voted-message" id="voted-message">✓ 已完成投票</div>
        </div>
        
        <div class="card" id="vote-results-card" style="display:none">
            <div class="card-title">投票结果</div>
            <div class="day-indicator" id="day-indicator">第 1 天</div>
            <div class="swipe-container" id="swipe-container" ontouchstart="window.swipeStart(event)" ontouchmove="window.swipeMove(event)" ontouchend="window.swipeEnd(event)">
                <div class="vote-results" id="vote-results"></div>
            </div>
            <div class="swipe-hint">← 左右滑动查看历史 →</div>
        </div>
        
        <div class="modal" id="annotation-modal">
            <div class="modal-content">
                <div class="modal-title" id="annotation-title">标注身份</div>
                <div class="annotation-grid">
                    <button class="annotation-btn gold" onclick="window.setAnnotation('金')">金</button>
                    <button class="annotation-btn gold" onclick="window.setAnnotation('银')">银</button>
                    <button class="annotation-btn gold" onclick="window.setAnnotation('铜')">铜</button>
                    <button class="annotation-btn god" onclick="window.setAnnotation('巫')">巫</button>
                    <button class="annotation-btn god" onclick="window.setAnnotation('守')">守</button>
                    <button class="annotation-btn god" onclick="window.setAnnotation('猎')">猎</button>
                    <button class="annotation-btn wolf" onclick="window.setAnnotation('狼')">狼</button>
                    <button class="annotation-btn villager" onclick="window.setAnnotation('民')">民</button>
                    <button class="annotation-btn cancel" onclick="window.closeAnnotationModal()">取消</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://opfzulpitspblasmybba.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_M3SmjoDJZ3PUyLH_nF3Awg_v8O-EG6i';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let roomId = null;
        let secretKey = null;
        let roomData = null;
        let players = [];
        let currentPlayer = null;
        let selectedTarget = null;
        let countdownInterval = null;
        let currentVoteDay = 1;
        let swipeStartX = 0;
        let swipeEndX = 0;
        let annotations = {};
        let annotationTarget = null;

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function init() {
            roomId = getUrlParam('room');
            secretKey = getUrlParam('key');
            
            if (!roomId || !secretKey) {
                alert('参数无效');
                window.location.href = 'index.html';
                return;
            }
            
            sbClient.channel('room-' + roomId)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, loadRoom)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${roomId}` }, loadPlayers)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'votes', filter: `room_id=eq.${roomId}` }, loadVotes)
                .subscribe();
            
            await loadRoom();
            await loadPlayers();
            await loadVotes();
        }

        function isVotingComplete() {
            if (!roomData) return false;
            if (roomData.phase !== 'voting' && roomData.phase !== 'pk') return true;
            
            if (roomData.vote_timer) {
                const endTime = roomData.vote_timer + 10000;
                if (Date.now() >= endTime) {
                    return true;
                }
            }
            
            return false;
        }

        async function loadRoom() {
            const { data } = await sbClient.from('rooms').select('*').eq('id', roomId).single();
            roomData = data;
            if (roomData) {
                document.getElementById('day-info').textContent = `第 ${roomData.current_day} 天`;
                
                if ((roomData.phase === 'voting' || roomData.phase === 'pk') && !isVotingComplete()) {
                    showCountdown();
                } else {
                    hideCountdown();
                }
            }
            await loadVotes();
        }

        async function loadPlayers() {
            const { data } = await sbClient.from('players').select('*').eq('room_id', roomId).order('player_num');
            players = data || [];
            
            currentPlayer = players.find(p => p.key === secretKey);
            if (!currentPlayer) {
                alert('秘钥无效');
                window.location.href = 'index.html';
                return;
            }
            
            renderRole();
            renderPlayers();
        }

        async function loadVotes() {
            if (!roomData) return;
            
            if (currentVoteDay < 1) {
                currentVoteDay = 1;
            }
            
            const checkDayVotes = async (day) => {
                const { data: pkVotes } = await sbClient.from('votes')
                    .select('*')
                    .eq('room_id', roomId)
                    .eq('day', day)
                    .eq('mode', 'pk');
                
                if (pkVotes && pkVotes.length > 0) {
                    return pkVotes;
                }
                
                const { data: normalVotes } = await sbClient.from('votes')
                    .select('*')
                    .eq('room_id', roomId)
                    .eq('day', day)
                    .eq('mode', 'normal');
                
                return normalVotes || [];
            };
            
            let votes = await checkDayVotes(currentVoteDay);
            
            if (!votes.length && currentVoteDay !== roomData.current_day) {
                votes = await checkDayVotes(roomData.current_day);
            }
            
            if (!votes.length && roomData.current_day > 1) {
                votes = await checkDayVotes(roomData.current_day - 1);
                currentVoteDay = roomData.current_day - 1;
            }
            
            document.getElementById('day-indicator').textContent = `第 ${currentVoteDay} 天`;
            renderVoteResults(votes);
            
            const alivePlayers = players.filter(p => p.alive);
            if (votes.length >= alivePlayers.length && roomData.phase !== 'waiting') {
                hideCountdown();
            }
        }

        function renderRole() {
            if (!currentPlayer) return;
            
            const card = document.getElementById('role-card');
            card.className = 'role-card ' + currentPlayer.team;
            
            document.getElementById('role-icon').textContent = currentPlayer.role_icon;
            document.getElementById('role-name').textContent = currentPlayer.role_name;
            
            const teamText = currentPlayer.team === 'werewolf' ? '狼人阵营' : 
                             (currentPlayer.team === 'god' ? '神职阵营' : '平民阵营');
            document.getElementById('role-team').textContent = teamText;
            
            const statusEl = document.getElementById('alive-status');
            statusEl.className = 'alive-status ' + (currentPlayer.alive ? 'alive' : 'dead');
            statusEl.textContent = currentPlayer.alive ? '存活' : '已出局';
        }

        function renderPlayers() {
            const container = document.getElementById('players-row');
            const isVoting = roomData && (roomData.phase === 'voting' || roomData.phase === 'pk') && !isVotingComplete();
            const isWerewolf = currentPlayer && currentPlayer.team === 'werewolf';
            
            let html = '';
            players.forEach((p) => {
                const isSelf = p.key === secretKey;
                const canSelect = isVoting && currentPlayer && currentPlayer.alive && !currentPlayer.has_voted && p.alive && !isSelf;
                const isWolfTeammate = isWerewolf && p.team === 'werewolf';
                
                let canSelectInPk = true;
                if (roomData && roomData.phase === 'pk') {
                    const pkTargets = roomData.pk_targets || [];
                    canSelectInPk = pkTargets.includes(p.player_num + '号');
                }
                
                const classes = ['player-avatar'];
                if (!p.alive) classes.push('dead');
                if (isWolfTeammate || (isWerewolf && isSelf)) classes.push('wolf-teammate');
                else if (isSelf) classes.push('self');
                if (canSelect && canSelectInPk) classes.push('can-vote');
                if (selectedTarget === p.player_num + '号') classes.push('selected');
                
                const annotation = annotations[p.player_num];
                let annotationHtml = '';
                if (annotation) {
                    const colorClass = annotation.team === 'gold' ? 'annotation-gold' :
                                      (annotation.team === 'god' ? 'annotation-god' : 
                                      (annotation.team === 'werewolf' ? 'annotation-wolf' : 'annotation-villager'));
                    annotationHtml = `<span class="annotation ${colorClass}">${annotation.label}</span>`;
                }
                
                const isSelfDestruct = p.vote_target === '自爆';
                const sdBadge = isSelfDestruct ? '<span class="sd-badge">💥</span>' : '';
                
                const onclick = (canSelect && canSelectInPk) ? `onclick="window.selectPlayer('${p.player_num}号')"` : `onclick="window.showAnnotationMenu(${p.player_num})"`;
                const displayText = isSelf ? '我' : p.player_num;
                
                html += `<div class="${classes.join(' ')}" ${onclick}>${displayText}${annotationHtml}${sdBadge}</div>`;
            });
            container.innerHTML = html;
            
            const voteActions = document.getElementById('vote-actions');
            const votedMessage = document.getElementById('voted-message');
            
            if (isVoting && currentPlayer && currentPlayer.alive && !currentPlayer.has_voted) {
                voteActions.classList.add('show');
                votedMessage.classList.remove('show');
            } else if (isVoting && currentPlayer && currentPlayer.has_voted) {
                voteActions.classList.remove('show');
                votedMessage.classList.add('show');
            } else {
                voteActions.classList.remove('show');
                votedMessage.classList.remove('show');
            }
        }

        window.selectPlayer = function(name) {
            selectedTarget = name;
            renderPlayers();
        };

        window.confirmVote = async function() {
            if (!currentPlayer || currentPlayer.has_voted) {
                alert('你已经投过票了');
                return;
            }
            
            if (!selectedTarget) {
                alert('请选择投票对象');
                return;
            }
            
            await sbClient.from('votes').insert({
                room_id: roomId,
                day: roomData.current_day,
                mode: roomData.pk_mode || 'normal',
                voter: currentPlayer.player_num + '号',
                target: selectedTarget
            });
            
            await sbClient.from('players')
                .update({ has_voted: true, vote_target: selectedTarget })
                .eq('id', currentPlayer.id);
            
            currentPlayer.has_voted = true;
            currentPlayer.vote_target = selectedTarget;
            renderPlayers();
        };

        window.abstainVote = async function() {
            if (!currentPlayer || currentPlayer.has_voted) {
                alert('你已经投过票了');
                return;
            }
            
            await sbClient.from('votes').insert({
                room_id: roomId,
                day: roomData.current_day,
                mode: roomData.pk_mode || 'normal',
                voter: currentPlayer.player_num + '号',
                target: '弃票'
            });
            
            await sbClient.from('players')
                .update({ has_voted: true, vote_target: '弃票' })
                .eq('id', currentPlayer.id);
            
            currentPlayer.has_voted = true;
            currentPlayer.vote_target = '弃票';
            renderPlayers();
        };

        function showCountdown() {
            document.getElementById('countdown-bar').classList.add('show');
            document.getElementById('countdown-mode').textContent = roomData.pk_mode === 'pk' ? 'PK票进行中...' : '普票进行中...';
            
            if (roomData.pk_mode === 'pk' && roomData.pk_targets && roomData.pk_targets.length > 0) {
                document.getElementById('pk-targets').textContent = 'PK玩家：' + roomData.pk_targets.join('、');
            } else {
                document.getElementById('pk-targets').textContent = '';
            }
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            const endTime = roomData.vote_timer + 10000;
            
            countdownInterval = setInterval(() => {
                const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                document.getElementById('countdown-number').textContent = remaining;
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    hideCountdown();
                }
            }, 200);
        }

        function hideCountdown() {
            document.getElementById('countdown-bar').classList.remove('show');
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            loadVotes();
        }

        function renderVoteResults(votes) {
            if (!votes.length && !players.length) {
                document.getElementById('vote-results-card').style.display = 'none';
                return;
            }
            
            document.getElementById('vote-results-card').style.display = 'block';
            
            const isWerewolf = currentPlayer && currentPlayer.team === 'werewolf';
            const wolfNumbers = isWerewolf ? players.filter(p => p.team === 'werewolf').map(p => p.player_num) : [];
            
            const grouped = {};
            const votedPlayers = new Set();
            votes.forEach(v => {
                if (!grouped[v.target]) grouped[v.target] = [];
                grouped[v.target].push(v.voter);
                votedPlayers.add(v.voter);
            });
            
            const alivePlayers = players.filter(p => p.alive);
            alivePlayers.forEach(p => {
                const playerName = p.player_num + '号';
                if (!votedPlayers.has(playerName)) {
                    if (!grouped['弃票']) grouped['弃票'] = [];
                    grouped['弃票'].push(playerName);
                }
            });
            
            let html = '';
            for (const [target, voters] of Object.entries(grouped)) {
                const isAbstain = target === '弃票';
                html += '<div class="vote-row">';
                
                voters.forEach(v => {
                    const num = parseInt(v.replace('号', ''));
                    const isWolf = isWerewolf && wolfNumbers.includes(num);
                    html += `<div class="vote-avatar ${isWolf ? 'wolf-vote' : ''}">${v.replace('号', '')}</div>`;
                });
                
                html += `<span class="vote-arrow">→</span>`;
                const targetNum = parseInt(target.replace('号', ''));
                const isTargetWolf = isWerewolf && wolfNumbers.includes(targetNum);
                html += `<div class="vote-avatar ${isAbstain ? 'vote-abstain' : ''} ${isTargetWolf ? 'wolf-vote' : ''}">${isAbstain ? '弃' : target.replace('号', '')}</div>`;
                html += '</div>';
            }
            
            document.getElementById('vote-results').innerHTML = html;
        }

        window.swipeStart = function(event) {
            swipeStartX = event.touches[0].clientX;
            document.getElementById('vote-results').style.transition = 'none';
        };

        window.swipeMove = function(event) {
            swipeEndX = event.touches[0].clientX;
            const diff = swipeEndX - swipeStartX;
            const voteResults = document.getElementById('vote-results');
            if (voteResults) {
                voteResults.style.transform = `translateX(${diff}px)`;
            }
        };

        window.swipeEnd = function() {
            const diff = swipeEndX - swipeStartX;
            const threshold = 50;
            const voteResults = document.getElementById('vote-results');
            
            voteResults.style.transition = 'transform 0.3s ease';
            
            if (diff > threshold) {
                if (currentVoteDay > 1) {
                    voteResults.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        currentVoteDay--;
                        loadVotes();
                        voteResults.style.transform = 'translateX(0)';
                    }, 300);
                } else {
                    voteResults.style.transform = 'translateX(0)';
                }
            } else if (diff < -threshold) {
                if (currentVoteDay < roomData.current_day) {
                    voteResults.style.transform = 'translateX(-100%)';
                    setTimeout(() => {
                        currentVoteDay++;
                        loadVotes();
                        voteResults.style.transform = 'translateX(0)';
                    }, 300);
                } else {
                    voteResults.style.transform = 'translateX(0)';
                }
            } else {
                voteResults.style.transform = 'translateX(0)';
            }
        };

        window.showAnnotationMenu = function(playerNum) {
            annotationTarget = playerNum;
            const modal = document.getElementById('annotation-modal');
            modal.classList.add('show');
            modal.onclick = function(e) {
                if (e.target === modal) {
                    closeAnnotationModal();
                }
            };
        };

        window.closeAnnotationModal = function() {
            document.getElementById('annotation-modal').classList.remove('show');
            annotationTarget = null;
        };

        window.setAnnotation = function(label) {
            if (!annotationTarget) return;
            
            const teamMap = {
                '金': 'gold',
                '银': 'gold',
                '铜': 'gold',
                '预': 'god',
                '巫': 'god',
                '守': 'god',
                '猎': 'god',
                '狼': 'werewolf',
                '民': 'villager'
            };
            
            const currentAnnotation = annotations[annotationTarget];
            if (currentAnnotation && currentAnnotation.label === label) {
                delete annotations[annotationTarget];
            } else {
                annotations[annotationTarget] = {
                    label: label,
                    team: teamMap[label] || 'villager'
                };
            }
            
            renderPlayers();
            closeAnnotationModal();
        };

        init();
    </script>
</body>
</html>
