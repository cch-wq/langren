<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狼人杀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #999;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1890ff;
        }
        .input-group input::placeholder {
            letter-spacing: 0;
            font-size: 14px;
            color: #bbb;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .error {
            color: #ff4d4f;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e8e8;
        }
        .divider span {
            padding: 0 15px;
            color: #999;
            font-size: 12px;
        }
        .create-link {
            color: #1890ff;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐺</div>
        <h1>狼人杀</h1>
        <p class="subtitle">输入秘钥进入游戏</p>
        
        <form id="enter-form" onsubmit="return handleSubmit(event)">
            <div class="input-group">
                <label>房间号（3位数字）</label>
                <input type="text" id="room-input" placeholder="例如：123" maxlength="3" required pattern="[0-9]{3}">
            </div>
            <div class="input-group">
                <label>秘钥</label>
                <input type="text" id="key-input" placeholder="输入你的6位数字秘钥" maxlength="8" required>
            </div>
            <button class="btn btn-primary" type="submit">进入游戏</button>
            <p class="error" id="error-msg"></p>
        </form>
        
        <div class="divider"><span>或者</span></div>
        
        <a href="/create" class="create-link">创建新房间</a>
    </div>
    
    <script>
        function handleSubmit(e) {
            e.preventDefault();
            
            const roomId = document.getElementById('room-input').value.trim();
            const key = document.getElementById('key-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (roomId.length !== 3) {
                errorMsg.textContent = '请输入3位房间号';
                errorMsg.classList.add('show');
                return false;
            }
            
            if (key.length < 6) {
                errorMsg.textContent = '请输入正确的秘钥';
                errorMsg.classList.add('show');
                return false;
            }
            
            // 提交验证
            fetch('/api/enter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, key: key })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorMsg.textContent = data.error || '验证失败';
                    errorMsg.classList.add('show');
                }
            })
            .catch(() => {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
            });
            
            return false;
        }
        
        // 自动聚焦
        document.getElementById('room-input').focus();
    </script>
</body>
</html>
