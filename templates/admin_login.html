<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀 - 管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ff6b6b;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            font-family: monospace;
        }
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff6b6b;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #ee5a5a;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 14px;
        }
        .back-link {
            margin-top: 20px;
            color: #4ecdc4;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 管理员登录</h1>
        <p class="subtitle">输入房间号和管理员秘钥进入管理界面</p>
        
        <div class="form-group">
            <label>房间号</label>
            <input type="text" id="room_id" placeholder="如：ABCD" maxlength="4" style="text-transform: uppercase;">
        </div>
        
        <div class="form-group">
            <label>管理员秘钥</label>
            <input type="text" id="admin_key" placeholder="创建房间时获得的8位秘钥" maxlength="8" style="text-transform: uppercase;">
        </div>
        
        <button onclick="login()">进入管理界面</button>
        
        <p class="error-msg" id="error-msg" style="display: none;"></p>
        
        <a href="/" class="back-link">← 返回首页</a>
    </div>
    
    <script>
        async function login() {
            const roomId = document.getElementById('room_id').value.toUpperCase();
            const adminKey = document.getElementById('admin_key').value.toUpperCase();
            
            if (!roomId || !adminKey) {
                document.getElementById('error-msg').textContent = '请填写完整信息';
                document.getElementById('error-msg').style.display = 'block';
                return;
            }
            
            const response = await fetch('/admin_verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, admin_key: adminKey })
            });
            
            const data = await response.json();
            
            if (data.success) {
                window.location.href = `/host/${roomId}?key=${adminKey}`;
            } else {
                document.getElementById('error-msg').textContent = data.error;
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
