<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀 - 玩家登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #4ecdc4;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            text-align: center;
            font-family: monospace;
        }
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #4ecdc4;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #45b7aa;
            transform: translateY(-2px);
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .back-link {
            margin-top: 20px;
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 玩家登录</h1>
        <p class="subtitle">输入房间号和秘钥查看你的身份</p>
        
        <div class="form-group">
            <label>房间号</label>
            <input type="text" id="room_id" placeholder="如：ABCD" maxlength="4" style="text-transform: uppercase;">
        </div>
        
        <div class="form-group">
            <label>身份秘钥</label>
            <input type="text" id="secret_key" placeholder="主持人发给你的6位秘钥" maxlength="6" style="text-transform: uppercase;">
        </div>
        
        <button onclick="enterGame()">进入游戏</button>
        
        <p class="hint">秘钥由主持人分发，请联系主持人获取</p>
        
        <a href="/" class="back-link">← 返回首页</a>
    </div>
    
    <script>
        function enterGame() {
            const roomId = document.getElementById('room_id').value.toUpperCase();
            const secretKey = document.getElementById('secret_key').value.toUpperCase();
            
            if (!roomId || !secretKey) {
                alert('请填写完整信息');
                return;
            }
            
            window.location.href = `/player?room=${roomId}&key=${secretKey}`;
        }
    </script>
</body>
</html>
