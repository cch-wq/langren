<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狼人杀 - 主持人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 10px;
            color: #333;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 12px;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 5px;
        }
        .room-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .info-item {
            text-align: center;
            padding: 8px 12px;
            background: #f8f8f8;
            border-radius: 8px;
        }
        .info-item label {
            display: block;
            font-size: 11px;
            color: #999;
        }
        .info-item span {
            font-size: 16px;
            font-weight: bold;
            color: #1890ff;
        }
        
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .vote-control {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .vote-control button {
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start { background: #52c41a; color: white; }
        .btn-end { background: #ff4d4f; color: white; }
        .btn-next { background: #1890ff; color: white; }
        .btn-pk { background: #722ed1; color: white; }
        button:disabled {
            background: #d9d9d9 !important;
            color: #999 !important;
            cursor: not-allowed;
        }
        
        .vote-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #1890ff;
        }
        .stat-item .label {
            font-size: 12px;
            color: #999;
        }
        
        .countdown-bar {
            background: #fff1f0;
            border: 2px solid #ff4d4f;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
        .countdown-bar.active { display: block; }
        .countdown-number {
            font-size: 40px;
            font-weight: bold;
            color: #ff4d4f;
        }
        .countdown-text { color: #999; font-size: 12px; }
        
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
        }
        .player-card {
            background: #fff;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #e8e8e8;
            position: relative;
        }
        .player-card:active { transform: scale(0.95); }
        .player-card.dead {
            opacity: 0.4;
            background: #f5f5f5;
            border-color: #d9d9d9;
            cursor: not-allowed;
        }
        .player-card.pk-selected {
            border-color: #722ed1 !important;
            background: #f9f0ff !important;
            box-shadow: 0 0 0 2px rgba(114, 46, 209, 0.3);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
            max-width: 320px;
            width: 100%;
            text-align: center;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            margin: 5px;
            cursor: pointer;
        }
        .modal-btn.primary { background: #1890ff; color: white; }
        .modal-btn.danger { background: #ff4d4f; color: white; }
        .modal-btn.default { background: #f5f5f5; color: #333; }
        
        .vote-results { max-height: 300px; overflow-y: auto; }
        .vote-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 5px;
            flex-wrap: wrap;
        }
        .vote-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            background: #f0f0f0;
            border: 2px solid #d9d9d9;
        }
        .vote-arrow { color: #999; font-size: 14px; }
        .vote-target {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            background: #e6f7ff;
            border: 2px solid #1890ff;
        }
        
        .hint { font-size: 11px; color: #999; margin-bottom: 8px; }
        
        .pk-section {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f9f0ff;
            border-radius: 8px;
        }
        .pk-section.active { display: block; }
        .pk-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .pk-item {
            padding: 8px 16px;
            background: #fff;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 2px solid #d9d9d9;
        }
        .pk-item.selected {
            border-color: #722ed1;
            background: #f9f0ff;
        }
        
        /* 分发秘钥 - 紧凑 */
        .key-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .key-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
        }
        .key-num { font-weight: bold; }
        .key-role { color: #666; }
        .key-value {
            color: #1890ff;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            background: #e6f7ff;
            border-radius: 4px;
        }
        .key-value:active { background: #1890ff; color: white; }
        
        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff4d4f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* 复制成功提示 */
        .copy-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            display: none;
        }
        .copy-toast.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐺 狼人杀</h1>
            <div class="room-info">
                <div class="info-item">
                    <label>房间号</label>
                    <span>{{ game.room_id }}</span>
                </div>
                <div class="info-item">
                    <label>当前</label>
                    <span id="day-display">第 {{ game.current_day }} 天</span>
                </div>
            </div>
        </header>
        
        <div id="countdown-bar" class="countdown-bar">
            <div class="countdown-number" id="countdown-number">10</div>
            <div class="countdown-text" id="countdown-mode">普票进行中...</div>
        </div>
        
        <div class="card">
            <div class="vote-stats">
                <div class="stat-item">
                    <div class="number" id="voted-count">0</div>
                    <div class="label">已投票</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="alive-count">{{ game.players|selectattr('alive')|list|length }}</div>
                    <div class="label">存活</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="total-count">{{ game.players|length }}</div>
                    <div class="label">总人数</div>
                </div>
            </div>
            <div class="vote-control">
                <button class="btn-start" id="btn-start" onclick="startVote()">普票</button>
                <button class="btn-pk" id="btn-pk" onclick="showPkPanel()">PK票</button>
                <button class="btn-end" id="btn-end" onclick="endVote()" disabled>结束</button>
                <button class="btn-next" id="btn-next" onclick="nextDay()" disabled>下一天</button>
            </div>
            
            <div class="pk-section" id="pk-section">
                <p class="hint">选择PK玩家后点击"开始PK"</p>
                <div class="pk-list" id="pk-list"></div>
                <button class="btn-pk" onclick="startPkVote()">开始PK投票</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">👥 玩家列表（点击淘汰/复活）</div>
            <div class="player-grid" id="player-grid"></div>
        </div>
        
        <div class="card">
            <div class="card-title">📊 投票结果</div>
            <div id="vote-results" class="vote-results">
                <p style="color: #999; text-align: center; padding: 10px; font-size: 12px;">暂无投票记录</p>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📋 分发秘钥（点击复制）</div>
            <div class="key-list" id="key-list"></div>
        </div>
        
        <div class="card" style="background:#fff1f0;border:2px solid #ff4d4f;">
            <button class="reset-btn" onclick="resetGame()">结束本局，重新开始</button>
        </div>
    </div>
    
    <div class="modal" id="confirm-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">确认操作</div>
            <p id="modal-message" style="margin-bottom: 15px; color: #666;"></p>
            <div>
                <button class="modal-btn danger" onclick="confirmAction()">确认</button>
                <button class="modal-btn default" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>
    
    <div class="copy-toast" id="copy-toast">复制成功</div>
    
    <script>
        const roomId = '{{ game.room_id }}';
        let gameData = {{ game|tojson|safe }};
        let selectedPkPlayers = [];
        let pendingEliminate = null;
        
        function updateGame() {
            fetch(`/api/game/${roomId}`)
                .then(res => res.json())
                .then(data => {
                    gameData = data;
                    renderUI();
                });
        }
        
        function renderUI() {
            const voted = gameData.players.filter(p => p.has_voted).length;
            const alive = gameData.players.filter(p => p.alive).length;
            document.getElementById('voted-count').textContent = voted;
            document.getElementById('alive-count').textContent = alive;
            document.getElementById('day-display').textContent = `第 ${gameData.current_day} 天`;
            
            renderPlayerGrid();
            renderKeyList();
            
            const btnStart = document.getElementById('btn-start');
            const btnEnd = document.getElementById('btn-end');
            const btnNext = document.getElementById('btn-next');
            const btnPk = document.getElementById('btn-pk');
            const countdownBar = document.getElementById('countdown-bar');
            const pkSection = document.getElementById('pk-section');
            
            if (gameData.phase === 'voting' || gameData.phase === 'pk') {
                btnStart.disabled = true;
                btnPk.disabled = true;
                btnEnd.disabled = false;
                countdownBar.classList.add('active');
                pkSection.classList.remove('active');
                
                if (gameData.phase === 'pk') {
                    document.getElementById('countdown-mode').textContent = 'PK票进行中...';
                } else {
                    document.getElementById('countdown-mode').textContent = '普票进行中...';
                }
                
                const elapsed = (Date.now() / 1000) - gameData.vote_timer;
                const remaining = Math.max(0, 10 - Math.floor(elapsed));
                document.getElementById('countdown-number').textContent = remaining;
                
                if (remaining <= 0) {
                    endVote();
                }
            } else {
                btnStart.disabled = false;
                btnPk.disabled = false;
                btnEnd.disabled = true;
                countdownBar.classList.remove('active');
            }
            
            btnNext.disabled = gameData.phase === 'voting' || gameData.phase === 'pk';
            
            renderVoteResults();
        }
        
        function renderPlayerGrid() {
            const container = document.getElementById('player-grid');
            let html = '';
            
            gameData.players.forEach((p, idx) => {
                const num = idx + 1;
                const classes = ['player-card'];
                if (!p.alive) classes.push('dead');
                if (selectedPkPlayers.includes(p.name)) classes.push('pk-selected');
                
                html += `<div class="${classes.join(' ')}" onclick="togglePlayer('${p.key}', '${p.name}', ${p.alive})">${num}</div>`;
            });
            container.innerHTML = html;
        }
        
        function renderKeyList() {
            const container = document.getElementById('key-list');
            let html = '';
            
            gameData.players.forEach((p, idx) => {
                const num = idx + 1;
                html += `<div class="key-item"><span class="key-num">${num}号</span><span class="key-role">${p.role_name}</span><span class="key-value" onclick="copyKey('${p.key}')">${p.key}</span></div>`;
            });
            container.innerHTML = html;
        }
        
        function renderVoteResults() {
            const resultsDiv = document.getElementById('vote-results');
            
            if (gameData.phase === 'voting' || gameData.phase === 'pk') {
                resultsDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 10px; font-size: 12px;">投票进行中...</p>';
                return;
            }
            
            // 收集所有有投票记录的天数
            const voteDays = [];
            for (let day = 1; day <= gameData.current_day; day++) {
                const normalKey = `day_${day}_normal`;
                const pkKey = `day_${day}_pk`;
                if ((gameData.votes[normalKey] && Object.keys(gameData.votes[normalKey]).length > 0) ||
                    (gameData.votes[pkKey] && Object.keys(gameData.votes[pkKey]).length > 0)) {
                    voteDays.push(day);
                }
            }
            
            if (voteDays.length === 0) {
                resultsDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 10px; font-size: 12px;">暂无投票记录</p>';
                return;
            }
            
            let html = '<div style="overflow-x:auto;display:flex;gap:15px;scroll-snap-type:x mandatory;">';
            
            voteDays.forEach(day => {
                const normalKey = `day_${day}_normal`;
                const pkKey = `day_${day}_pk`;
                
                html += `<div style="min-width:100%;flex-shrink:0;scroll-snap-align:start;">`;
                html += `<div style="font-size:14px;font-weight:bold;color:#1890ff;margin-bottom:10px;">第${day}天投票结果</div>`;
                
                // 普票
                if (gameData.votes[normalKey] && Object.keys(gameData.votes[normalKey]).length > 0) {
                    html += renderVoteRows(gameData.votes[normalKey]);
                }
                
                // PK票
                if (gameData.votes[pkKey] && Object.keys(gameData.votes[pkKey]).length > 0) {
                    html += '<div style="font-size:11px;color:#722ed1;margin:8px 0 4px;">PK票</div>';
                    html += renderVoteRows(gameData.votes[pkKey]);
                }
                
                html += '</div>';
            });
            
            html += '</div>';
            
            // 底部指示点
            if (voteDays.length > 1) {
                html += '<div style="display:flex;justify-content:center;gap:6px;padding-top:10px;">';
                voteDays.forEach((day, idx) => {
                    html += `<div style="width:8px;height:8px;border-radius:50%;background:${idx === voteDays.length - 1 ? '#1890ff' : '#d9d9d9'}"></div>`;
                });
                html += '</div>';
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function renderVoteRows(votes) {
            // 按目标分组
            const targetGroups = {};
            const abstainVoters = [];
            
            for (const [key, target] of Object.entries(votes)) {
                const voter = gameData.players.find(p => p.key === key);
                if (voter) {
                    if (target === 'abstain') {
                        abstainVoters.push(voter.name.replace('号', ''));
                    } else {
                        if (!targetGroups[target]) targetGroups[target] = [];
                        targetGroups[target].push(voter.name.replace('号', ''));
                    }
                }
            }
            
            let html = '<div style="display:flex;flex-direction:column;gap:6px;">';
            
            // 显示投票
            for (const [target, voters] of Object.entries(targetGroups)) {
                const targetNum = target.replace('号', '');
                html += '<div class="vote-row">';
                voters.forEach(v => {
                    html += `<div class="vote-avatar">${v}</div>`;
                });
                html += `<span class="vote-arrow">→</span><div class="vote-target">${targetNum}</div></div>`;
            }
            
            // 显示弃票
            if (abstainVoters.length > 0) {
                html += '<div class="vote-row">';
                abstainVoters.forEach(v => {
                    html += `<div class="vote-avatar" style="background:#fffbe6;border-color:#faad14;">${v}</div>`;
                });
                html += `<span class="vote-arrow">→</span><div class="vote-target" style="background:#fffbe6;border-color:#faad14;">弃</div></div>`;
            }
            
            html += '</div>';
            return html;
        }
        
        function togglePlayer(key, name, isAlive) {
            pendingEliminate = { key, name, isAlive };
            const modal = document.getElementById('confirm-modal');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            
            title.textContent = isAlive ? '淘汰玩家' : '复活玩家';
            message.textContent = `确定要${isAlive ? '淘汰' : '复活'} ${name} 吗？`;
            modal.classList.add('active');
        }
        
        function confirmAction() {
            if (pendingEliminate) {
                if (pendingEliminate.isAlive) {
                    eliminatePlayer(pendingEliminate.name);
                } else {
                    revivePlayer(pendingEliminate.name);
                }
            }
            closeModal();
        }
        
        function closeModal() {
            document.getElementById('confirm-modal').classList.remove('active');
            pendingEliminate = null;
        }
        
        async function eliminatePlayer(name) {
            await fetch(`/api/eliminate/${roomId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_name: name })
            });
            updateGame();
        }
        
        async function revivePlayer(name) {
            await fetch(`/api/revive/${roomId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_name: name })
            });
            updateGame();
        }
        
        async function startVote() {
            selectedPkPlayers = [];
            await fetch(`/api/start_vote/${roomId}`, { method: 'POST' });
            updateGame();
        }
        
        async function endVote() {
            await fetch(`/api/end_vote/${roomId}`, { method: 'POST' });
            updateGame();
        }
        
        async function nextDay() {
            const confirmed = confirm('确定要进入下一天吗？');
            if (!confirmed) return;
            
            selectedPkPlayers = [];
            try {
                const response = await fetch(`/api/next_day/${roomId}`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    updateGame();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }
        
        function showPkPanel() {
            selectedPkPlayers = [];
            const pkList = document.getElementById('pk-list');
            let html = '';
            
            gameData.players.forEach(p => {
                if (p.alive) {
                    const num = p.name.replace('号', '');
                    html += `<div class="pk-item" onclick="togglePk('${p.name}', this)">${num}号</div>`;
                }
            });
            pkList.innerHTML = html;
            document.getElementById('pk-section').classList.add('active');
        }
        
        function togglePk(name, el) {
            const idx = selectedPkPlayers.indexOf(name);
            if (idx >= 0) {
                selectedPkPlayers.splice(idx, 1);
                el.classList.remove('selected');
            } else if (selectedPkPlayers.length < 4) {
                selectedPkPlayers.push(name);
                el.classList.add('selected');
            }
        }
        
        async function startPkVote() {
            if (selectedPkPlayers.length < 2) {
                alert('请至少选择2名PK玩家');
                return;
            }
            
            await fetch(`/api/start_pk/${roomId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targets: selectedPkPlayers })
            });
            document.getElementById('pk-section').classList.remove('active');
            updateGame();
        }
        
        function copyKey(key) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(key).then(() => {
                    showToast();
                });
            } else {
                // 备用方案
                const input = document.createElement('input');
                input.value = key;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast();
            }
        }
        
        function showToast() {
            const toast = document.getElementById('copy-toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }
        
        async function resetGame() {
            const confirmed = confirm('确定要结束本局并重新开始吗？\n所有玩家将获得新的身份和秘钥！');
            if (!confirmed) return;
            
            try {
                const response = await fetch(`/api/reset_game/${roomId}`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    alert('本局已结束，身份已重新分配！\n请重新分发新的秘钥给玩家。');
                    updateGame();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }
        
        setInterval(updateGame, 1500);
        updateGame();
    </script>
</body>
</html>
