<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狼人杀 - 创建房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .role-group {
            margin-bottom: 15px;
        }
        .role-group-title {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .role-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .role-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #fafafa;
            border-radius: 8px;
        }
        .role-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .role-icon {
            font-size: 18px;
        }
        .role-name {
            font-size: 12px;
        }
        .role-count {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .count-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: #e8e8e8;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .count-btn:active {
            background: #d9d9d9;
        }
        .count-num {
            font-size: 14px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .preset-btn {
            padding: 8px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 20px;
            background: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        .preset-btn:active {
            background: #e6f7ff;
            border-color: #1890ff;
        }
        
        .summary {
            background: #e6f7ff;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .summary-text {
            font-size: 12px;
            color: #666;
        }
        .summary-count {
            font-size: 28px;
            font-weight: bold;
            color: #1890ff;
        }
        
        .create-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .create-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        
        .password-section {
            margin: 15px 0;
        }
        .password-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .password-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        .password-section input:focus {
            outline: none;
            border-color: #1890ff;
        }
        
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #1890ff;
            text-decoration: none;
            font-size: 13px;
        }
        
        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            margin: 20px;
            max-width: 320px;
            width: 100%;
            text-align: center;
        }
        .modal-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .modal-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .modal-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .modal-row:last-child {
            margin-bottom: 0;
        }
        .modal-row span:last-child {
            font-weight: bold;
            color: #1890ff;
        }
        .modal-hint {
            font-size: 11px;
            color: #999;
            margin-bottom: 15px;
        }
        .modal-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .modal-btn.primary {
            background: #1890ff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐺</div>
            <h1>创建房间</h1>
        </header>
        
        <div class="card">
            <div class="card-title">快速预设</div>
            <div class="presets">
                <button class="preset-btn" onclick="loadPreset('6')">6人局</button>
                <button class="preset-btn" onclick="loadPreset('9')">9人局</button>
                <button class="preset-btn" onclick="loadPreset('12')">12人局</button>
                <button class="preset-btn" onclick="loadPreset('custom')">自定义</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">选择角色</div>
            
            <div class="role-group">
                <div class="role-group-title">🐺 狼人阵营</div>
                <div class="role-list">
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🐺</span><span class="role-name">狼人</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('werewolf', -1)">-</button><span class="count-num" id="count-werewolf">0</span><button class="count-btn" onclick="changeCount('werewolf', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">👑</span><span class="role-name">狼王</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('wolf_king', -1)">-</button><span class="count-num" id="count-wolf_king">0</span><button class="count-btn" onclick="changeCount('wolf_king', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🤍</span><span class="role-name">白狼王</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('white_wolf', -1)">-</button><span class="count-num" id="count-white_wolf">0</span><button class="count-btn" onclick="changeCount('white_wolf', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🤖</span><span class="role-name">机械狼</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('mechanical_wolf', -1)">-</button><span class="count-num" id="count-mechanical_wolf">0</span><button class="count-btn" onclick="changeCount('mechanical_wolf', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">💄</span><span class="role-name">狼美人</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('wolf_beauty', -1)">-</button><span class="count-num" id="count-wolf_beauty">0</span><button class="count-btn" onclick="changeCount('wolf_beauty', 1)">+</button></div>
                    </div>
                </div>
            </div>
            
            <div class="role-group">
                <div class="role-group-title">✨ 神职阵营</div>
                <div class="role-list">
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🔮</span><span class="role-name">预言家</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('seer', -1)">-</button><span class="count-num" id="count-seer">0</span><button class="count-btn" onclick="changeCount('seer', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🧙‍♀️</span><span class="role-name">女巫</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('witch', -1)">-</button><span class="count-num" id="count-witch">0</span><button class="count-btn" onclick="changeCount('witch', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🏹</span><span class="role-name">猎人</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('hunter', -1)">-</button><span class="count-num" id="count-hunter">0</span><button class="count-btn" onclick="changeCount('hunter', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🛡️</span><span class="role-name">守卫</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('guard', -1)">-</button><span class="count-num" id="count-guard">0</span><button class="count-btn" onclick="changeCount('guard', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">⚔️</span><span class="role-name">骑士</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('knight', -1)">-</button><span class="count-num" id="count-knight">0</span><button class="count-btn" onclick="changeCount('knight', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">👻</span><span class="role-name">通灵师</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('medium', -1)">-</button><span class="count-num" id="count-medium">0</span><button class="count-btn" onclick="changeCount('medium', 1)">+</button></div>
                    </div>
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">🤪</span><span class="role-name">白痴</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('idiot', -1)">-</button><span class="count-num" id="count-idiot">0</span><button class="count-btn" onclick="changeCount('idiot', 1)">+</button></div>
                    </div>
                </div>
            </div>
            
            <div class="role-group">
                <div class="role-group-title">👨‍🌾 平民阵营</div>
                <div class="role-list">
                    <div class="role-item">
                        <div class="role-info"><span class="role-icon">👨‍🌾</span><span class="role-name">平民</span></div>
                        <div class="role-count"><button class="count-btn" onclick="changeCount('villager', -1)">-</button><span class="count-num" id="count-villager">0</span><button class="count-btn" onclick="changeCount('villager', 1)">+</button></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="summary">
                <div class="summary-text">总人数</div>
                <div class="summary-count" id="total-count">0</div>
            </div>
            <div class="password-section">
                <label>创建密码</label>
                <input type="password" id="create-password" placeholder="输入创建密码" maxlength="10">
            </div>
            <button class="create-btn" id="create-btn" onclick="createGame()" disabled>创建房间</button>
        </div>
        
        <div class="back-link">
            <a href="/">← 返回首页</a>
        </div>
    </div>
    
    <!-- 成功弹窗 -->
    <div class="modal" id="success-modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">房间创建成功！</div>
            <div class="modal-info">
                <div class="modal-row"><span>房间号</span><span id="modal-room"></span></div>
            </div>
            <p class="modal-hint">管理员密码：<strong>13544</strong>，用于进入主持人界面</p>
            <button class="modal-btn primary" onclick="enterHost()">进入主持人界面</button>
        </div>
    </div>
    
    <script>
        const roles = {
            werewolf: 0, wolf_king: 0, white_wolf: 0, mechanical_wolf: 0, wolf_beauty: 0,
            seer: 0, witch: 0, hunter: 0, guard: 0, knight: 0, medium: 0, idiot: 0,
            villager: 0
        };
        
        let createdRoom = null;
        
        const presets = {
            '6': { werewolf: 2, seer: 1, witch: 1, villager: 2 },
            '9': { werewolf: 3, seer: 1, witch: 1, hunter: 1, villager: 3 },
            '12': { werewolf: 4, seer: 1, witch: 1, hunter: 1, guard: 1, villager: 4 }
        };
        
        function loadPreset(name) {
            // 重置
            Object.keys(roles).forEach(r => {
                roles[r] = 0;
                document.getElementById('count-' + r).textContent = '0';
            });
            
            if (presets[name]) {
                Object.entries(presets[name]).forEach(([role, count]) => {
                    roles[role] = count;
                    document.getElementById('count-' + role).textContent = count;
                });
            }
            updateTotal();
        }
        
        function changeCount(role, delta) {
            const newVal = Math.max(0, roles[role] + delta);
            roles[role] = newVal;
            document.getElementById('count-' + role).textContent = newVal;
            updateTotal();
        }
        
        function updateTotal() {
            const total = Object.values(roles).reduce((a, b) => a + b, 0);
            document.getElementById('total-count').textContent = total;
            document.getElementById('create-btn').disabled = total < 3;
        }
        
        async function createGame() {
            const password = document.getElementById('create-password').value;
            if (!password) {
                alert('请输入创建密码');
                return;
            }
            
            const response = await fetch('/create_game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roles, password })
            });
            
            const data = await response.json();
            
            if (data.room_id) {
                createdRoom = data;
                document.getElementById('modal-room').textContent = data.room_id;
                document.getElementById('modal-admin-key').textContent = data.admin_key;
                document.getElementById('success-modal').classList.add('active');
            } else {
                alert(data.error || '创建失败');
            }
        }
        
        function enterHost() {
            window.location.href = `/host/${createdRoom.room_id}`;
        }
    </script>
</body>
</html>
